name: Build

on: push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@master
      
      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
            run_install: true

      - name: Build 🏗️
        run: pnpm build
